name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/release-assets.mjs
      - scripts/publish-release.mjs
      - scripts/test-release.mjs
      - scripts/verify-macos-bundle.mjs
      - scripts/test-macos-bundle.mjs
      - docs/release-notes/**
      - scripts/generate-homebrew.mjs
      - scripts/build-linux-deb.sh
      - packaging/homebrew/**
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri*.json
      - src-tauri/Entitlements.plist
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v4.7.7)"
        required: true
        type: string

# Serialize publication; builds from a second tag must not race the latest release.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: source
        name: Validate the tagged source and all version files
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            RELEASE_TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="$(node scripts/release-assets.mjs source "$RELEASE_TAG")"
          COMMIT="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$COMMIT" ]]
            git merge-base --is-ancestor "$COMMIT" origin/main
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (x64)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate source version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-assets.mjs source "$RELEASE_TAG"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev git cmake clang libclang-dev pkg-config
      - name: Build Linux deb
        run: ./scripts/build-linux-deb.sh --native
      - name: Verify and stage Linux package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          PACKAGE="artifacts/release/Antigravity-Tools-Lite-${VERSION}-linux-amd64.deb"
          cp src-tauri/target/release/bundle/deb/*.deb "$PACKAGE"
          [[ "$(dpkg-deb -f "$PACKAGE" Architecture)" == "amd64" ]]
          [[ "$(dpkg-deb -f "$PACKAGE" Version)" == "$VERSION" ]]
          PAYLOAD="$RUNNER_TEMP/release-deb-payload"
          dpkg-deb -x "$PACKAGE" "$PAYLOAD"
          node scripts/test-cli.mjs "$PAYLOAD/usr/bin/antigravity-tools-lite"
          [[ "$("$PAYLOAD/usr/bin/antigravity-tools-lite" --version)" == "agy-lite $VERSION" ]]
          node scripts/release-assets.mjs checksum "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ needs.prepare.outputs.commit }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (x64)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate source version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-assets.mjs source "$env:RELEASE_TAG"
      - name: Install frontend dependencies
        run: npm ci
      - name: Ensure the Windows Tauri CLI binary
        shell: bash
        run: |
          set -euo pipefail
          if node -e "require('@tauri-apps/cli-win32-x64-msvc')" 2>/dev/null; then exit 0; fi
          CLI_VERSION="$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"
          curl -fLsS "https://registry.npmjs.org/@tauri-apps/cli-win32-x64-msvc/-/cli-win32-x64-msvc-${CLI_VERSION}.tgz" -o cli-win32.tgz
          mkdir -p node_modules/@tauri-apps/cli-win32-x64-msvc
          tar -xzf cli-win32.tgz -C node_modules/@tauri-apps/cli-win32-x64-msvc --strip-components=1
          node -e "require('@tauri-apps/cli-win32-x64-msvc')"
      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis -- --locked
      - name: Verify Windows release executable
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bytes = [IO.File]::ReadAllBytes('src-tauri/target/release/antigravity-tools.exe')
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'Expected x64 APP payload' }
          node scripts/test-cli.mjs src-tauri/target/release/antigravity-tools.exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke failed' }
          node --input-type=module -e 'import assert from "node:assert/strict"; import { execFileSync } from "node:child_process"; assert.equal(execFileSync("src-tauri/target/release/antigravity-tools.exe", ["--version"], { encoding: "utf8" }).trim(), "agy-lite " + process.env.VERSION);'
          if ($LASTEXITCODE -ne 0) { throw 'CLI version mismatch' }
          ./scripts/test-windows-cli.ps1 -Binary ./src-tauri/target/release/antigravity-tools.exe
      - name: Stage Windows package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          PACKAGE="artifacts/release/Antigravity-Tools-Lite-${VERSION}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/nsis/*.exe "$PACKAGE"
          node scripts/release-assets.mjs checksum "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ needs.prepare.outputs.commit }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (Apple Silicon)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate source version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-assets.mjs source "$RELEASE_TAG"
      - name: Install frontend dependencies
        run: npm ci
      - name: Test macOS signature integrity gates
        run: node --test scripts/test-macos-bundle.mjs
      - name: Build complete ad-hoc signed app bundle
        env:
          # Complete bundle sealing; not Developer ID signing or notarization.
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app -- --locked
      - name: Verify and stage app bundle and cask
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Antigravity Tools Lite.app"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          [[ "$EXECUTABLE" == "antigravity-tools" ]]
          [[ -x "$APP/Contents/MacOS/$EXECUTABLE" ]]
          [[ "$(lipo -archs "$APP/Contents/MacOS/antigravity-tools")" == "arm64" ]]
          node scripts/verify-macos-bundle.mjs "$APP" "$VERSION"
          [[ "$("$APP/Contents/MacOS/antigravity-tools" --version)" == "agy-lite $VERSION" ]]
          node scripts/test-cli.mjs "$APP/Contents/MacOS/antigravity-tools"
          mkdir -p artifacts/release
          NAME="Antigravity-Tools-Lite-${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/release/$NAME"
          ROUNDTRIP="$(mktemp -d "$RUNNER_TEMP/agy-macos-archive.XXXXXX")"
          ditto -x -k "artifacts/release/$NAME" "$ROUNDTRIP"
          node scripts/verify-macos-bundle.mjs "$ROUNDTRIP/Antigravity Tools Lite.app" "$VERSION"
          node scripts/release-assets.mjs checksum "artifacts/release/$NAME"
          node scripts/generate-homebrew.mjs --archive "artifacts/release/$NAME" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${NAME}" \
            --version "$VERSION" --output artifacts/release/antigravity-tools-lite.rb
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ needs.prepare.outputs.commit }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify complete package set
    needs: [prepare, linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.prepare.outputs.commit }}
          merge-multiple: true
          path: artifacts/release
      - name: Verify checksums, generated cask and source manifest without publishing
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release-assets.mjs verify artifacts/release "$RELEASE_TAG" "$RELEASE_COMMIT" "$GITHUB_REPOSITORY"

  publish:
    name: Verify draft assets and publish
    if: github.event_name != 'pull_request'
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.prepare.outputs.commit }}
          merge-multiple: true
          path: artifacts/release
      - name: Validate all packages, stage a draft, verify downloaded bytes, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/publish-release.mjs artifacts/release "$RELEASE_TAG" "$RELEASE_COMMIT" "$GITHUB_REPOSITORY"
